name: Build iOS XCFramework

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 明确指定分支，避免在错误分支上触发导致 third_party/aac 缺失
          ref: add-aac-softcodec-mp4recording
          fetch-depth: 1

      - name: 安装 Python 3.11 和 setuptools
        run: |
          brew install python@3.11
          /opt/homebrew/opt/python@3.11/bin/python3.11 -m pip install setuptools --break-system-packages

      - name: 安装 depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: 写入 gclient 配置
        run: |
          cd $HOME
          cat > .gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/liu9812111/amazon-kvs-webrtc-ndk-c.git@add-aac-softcodec-mp4recording",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {},
            },
          ]
          target_os = ["ios"]
          GCLIENT_EOF

      - name: 恢复 gclient 依赖缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/src/third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}
          restore-keys: gclient-ios-

      - name: 同步依赖并修复后执行 hooks
        run: |
          cd $HOME
          gclient sync --no-history --shallow --nohooks
          # 修复 mac_toolchain.py 在 Python 3.12+ 环境下 pkg_resources 缺失的问题
          python3 -c "
          path = '/Users/runner/src/build/mac_toolchain.py'
          with open(path) as f:
              content = f.read()
          if 'except ImportError' not in content:
              content = content.replace(
                  'import pkg_resources',
                  'try:\n    import pkg_resources\nexcept ImportError:\n    pkg_resources = None'
              )
              with open(path, 'w') as f:
                  f.write(content)
              print('mac_toolchain.py 修复完成')
          else:
              print('mac_toolchain.py 已修复过，跳过')
          "
          gclient runhooks

      - name: 保存 gclient 依赖缓存（即使后续步骤失败也保存）
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/src/third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}

      - name: 部署 third_party/aac 并生成正确的 BUILD.gn
        run: |
          AAC_SRC="$GITHUB_WORKSPACE/third_party/aac"
          AAC_DST="/Users/runner/src/third_party/aac"

          rm -rf "$AAC_DST"
          mkdir -p "$AAC_DST"

          if [ ! -d "$AAC_SRC/fdk-aac" ]; then
            git clone --depth=1 https://github.com/mstorsjo/fdk-aac.git "$AAC_DST/fdk-aac"
            rm -rf "$AAC_DST/fdk-aac/.git"
          else
            cp -R "$AAC_SRC/." "$AAC_DST/"
          fi

          echo "---- fdk-aac 目录结构（2层）----"
          find "$AAC_DST/fdk-aac" -maxdepth 2 -type d | sort

          # 用 Python 收集 sources 并生成 BUILD.gn，彻底避免 shell heredoc 的多行替换问题
          python3 - "$AAC_DST" << 'PYEOF'
          import os, sys

          aac_dst = sys.argv[1]
          fdk_root = os.path.join(aac_dst, "fdk-aac")

          print("---- fdk-aac 所有子目录 ----")
          for dirpath, dirnames, filenames in os.walk(fdk_root):
              rel = os.path.relpath(dirpath, fdk_root)
              cpp_count = len([f for f in filenames if f.endswith(".cpp")])
              if cpp_count > 0:
                  print(f"  {rel}  ({cpp_count} .cpp)") 

          # 收集所有 .cpp，只取各库 src/ 目录下的顶层文件
          # 排除所有平台特定子目录（arm/mips/x86/win32 等）
          excluded_dirs = {"arm", "win32", "x86", "fuzzer", "mips", "aarch64", "tests", "benchmark"}
          sources = []
          for dirpath, dirnames, filenames in os.walk(fdk_root):
              # 剔除路径中包含任何排除目录名的路径
              path_parts = set(os.path.relpath(dirpath, aac_dst).split(os.sep))
              if path_parts & excluded_dirs:
                  continue
              for fname in sorted(filenames):
                  if fname.endswith(".cpp"):
                      rel = os.path.relpath(os.path.join(dirpath, fname), aac_dst)
                      sources.append(rel)

          sources.sort()
          print(f"收集到 {len(sources)} 个 .cpp 文件")

          # 动态检测所有 include 目录（libXXX/include 格式）
          include_dirs = ["fdk-aac", "."]
          for entry in sorted(os.listdir(fdk_root)):
              inc = os.path.join(fdk_root, entry, "include")
              if os.path.isdir(inc):
                  include_dirs.append(f"fdk-aac/{entry}/include")

          print("include_dirs:")
          for d in include_dirs:
              print(f"  {d}")

          sources_str = "\n".join(f'    "{s}",' for s in sources)
          include_str = "\n".join(f'    "{d}",' for d in include_dirs)

          build_gn = f'''config("aac_includes") {{
            include_dirs = [
          {include_str}
            ]
          }}

          static_library("aac") {{
            sources = [
          {sources_str}
            ]
            defines = [ "SUPPRESS_BUILD_DATE_INFO" ]
            public_configs = [ ":aac_includes" ]
            configs -= [ "//build/config/compiler:chromium_code" ]
            configs += [ "//build/config/compiler:no_chromium_code" ]
            cflags = [ "-w" ]
            cflags_cc = [ "-w" ]
          }}

          group("rtc_aac") {{
            public_deps = [ ":aac" ]
          }}
          '''

          out_path = os.path.join(aac_dst, "BUILD.gn")
          with open(out_path, "w") as f:
              f.write(build_gn)
          print(f"BUILD.gn 已写入: {out_path}")
          PYEOF

          echo "---- $AAC_DST 内容 ----"
          ls -la "$AAC_DST"
          echo "---- sources 数量 ----"
          grep -c '\.cpp' "$AAC_DST/BUILD.gn" || true
          echo "---- BUILD.gn 完整内容 ----"
          cat "$AAC_DST/BUILD.gn"

      - name: 升级 clang 工具链（兼容 Xcode 15 SDK）
        run: |
          set -e
          cd /Users/runner/src

          ACTUAL_REV=$(third_party/llvm-build/Release+Asserts/bin/clang --version 2>&1 | grep -oE 'llvmorg-[^ ]+' | head -1 || true)

          if [ -z "$ACTUAL_REV" ]; then
            echo "=== clang 不存在，重新下载 ==="
            curl -fsSL "https://chromium.googlesource.com/chromium/src/+/refs/branch-heads/5993/tools/clang/scripts/update.py?format=TEXT" | python3 -c "import base64,sys;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > /tmp/clang_update.py
            rm -rf third_party/llvm-build
            python3.11 /tmp/clang_update.py --output-dir third_party/llvm-build/Release+Asserts
            cp /tmp/clang_update.py tools/clang/scripts/update.py
            ACTUAL_REV=$(third_party/llvm-build/Release+Asserts/bin/clang --version 2>&1 | grep -oE 'llvmorg-[^ ]+' | head -1)
          fi

          echo "实际 clang revision: $ACTUAL_REV"

          echo "aW1wb3J0IHN5cywgcmUKYWN0dWFsX3JldiA9IHN5cy5hcmd2WzFdCnAgPSAnL1VzZXJzL3J1bm5lci9zcmMvdG9vbHMvY2xhbmcvc2NyaXB0cy91cGRhdGUucHknCnMgPSBvcGVuKHApLnJlYWQoKQpzMiA9IHJlLnN1YihyJyhDTEFOR19SRVZJU0lPTlxzKj1ccyopW1wnIl0uKj9bXCciXScsIGxhbWJkYSBtOiBtLmdyb3VwKDEpICsgcmVwcihh" | base64 -d > /tmp/patch_clang.py
          echo "Y3R1YWxfcmV2KSwgcykKczIgPSByZS5zdWIocichKENMQU5HX1NVQl9SRVZJU0lPTlxzKj1ccyopXGQrJywgcidcZzwxPjAnLCBzMikKaWYgczIgPT0gczoKICAgIHByaW50KCdXQVJOSU5HOiBubyBjaGFuZ2UgbmVlZGVkJykKZWxzZToKICAgIG9wZW4ocCwgJ3cnKS53cml0ZShzMikKICAgIHByaW50KCdPSzogcGF0Y2hlZCB0byAnICsgYWN0dWFsX3JldikKdiA9" | base64 -d >> /tmp/patch_clang.py
          echo "IG9wZW4ocCkucmVhZCgpCmlmIGFjdHVhbF9yZXYgbm90IGluIHY6CiAgICBwcmludCgnRkFJTDogdmVyaWZ5IGZhaWxlZCcpCiAgICBzeXMuZXhpdCgxKQpwcmludCgnT0s6IHZlcmlmeSBwYXNzZWQnKQo=" | base64 -d >> /tmp/patch_clang.py
          python3 /tmp/patch_clang.py "$ACTUAL_REV"

          MAJOR=$(echo "$ACTUAL_REV" | sed -E 's/llvmorg-([0-9]+).*/\1/')
          if [ -n "$MAJOR" ]; then
            sed -i '' -E "s/clang_version = \"[0-9]+\"/clang_version = \"$MAJOR\"/" build/toolchain/toolchain.gni 2>/dev/null || true
            echo "toolchain.gni clang_version => $MAJOR"
          fi

          echo "最终 clang 版本："
          third_party/llvm-build/Release+Asserts/bin/clang --version

      - name: 生成 FFmpeg iOS 配置头文件（avconfig.h）
        run: |
          FFMPEG_SRC="/Users/runner/src/third_party/ffmpeg"
          FFMPEG_OUT="/Users/runner/src/out/ffmpeg-ios-config"
          mkdir -p "$FFMPEG_OUT"

          cd "$FFMPEG_SRC"

          # 手动生成 avconfig.h（最简单可靠的方案：直接写入）
          # 无需完整 configure，avconfig.h 内容在 iOS arm64 下是固定的
          mkdir -p "$FFMPEG_SRC/libavutil"
          cat > "$FFMPEG_SRC/libavutil/avconfig.h" << 'EOF'
          /* Generated for iOS arm64 */
          #ifndef AVUTIL_AVCONFIG_H
          #define AVUTIL_AVCONFIG_H
          #define AV_HAVE_BIGENDIAN 0
          #define AV_HAVE_FAST_UNALIGNED 1
          #endif /* AVUTIL_AVCONFIG_H */
          EOF

          echo "---- avconfig.h 内容 ----"
          cat "$FFMPEG_SRC/libavutil/avconfig.h"

      - name: 编译 iOS XCFramework
        run: |
          export PATH="/opt/homebrew/opt/python@3.11/bin:$HOME/depot_tools:$PATH"
          export PYTHONPATH="$HOME/depot_tools"
          cd /Users/runner/src
          # treat_warnings_as_errors=false：新版 clang 会对旧代码报一些新告警，
          # 关掉 -Werror 避免被无关告警打断
          python3.11 tools_webrtc/ios/build_ios_libs.py \
            --output out/ios-release \
            --arch arm64 \
            --build_config release \
            --extra-gn-args "treat_warnings_as_errors=false"

      - name: 打包成 zip
        run: |
          cd /Users/runner/src
          ls -la out/ios-release
          zip -ry $GITHUB_WORKSPACE/WebRTC.xcframework.zip out/ios-release/WebRTC.xcframework

      - name: 上传为 Artifact（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: WebRTC-iOS-XCFramework
          path: WebRTC.xcframework.zip
          retention-days: 30
