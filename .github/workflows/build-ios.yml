name: Diagnose Build Environment

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: add-aac-softcodec-mp4recording
          fetch-depth: 1

      - name: 安装 depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: 写入 gclient 配置
        run: |
          cd $HOME
          cat > .gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/liu9812111/amazon-kvs-webrtc-ndk-c.git@add-aac-softcodec-mp4recording",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {},
            },
          ]
          target_os = ["ios"]
          GCLIENT_EOF

      - name: 恢复 gclient 依赖缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/src/third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}
          restore-keys: gclient-ios-

      - name: 同步依赖（nohooks）
        run: |
          cd $HOME
          gclient sync --no-history --shallow --nohooks

      - name: 诊断 AAC
        run: |
          AAC_REPO="$GITHUB_WORKSPACE/third_party/aac"
          AAC_SYNC="/Users/runner/src/third_party/aac"

          echo "========================================"
          echo "==== 仓库里 third_party/aac 目录 ===="
          echo "========================================"
          ls -la "$AAC_REPO/" 2>/dev/null || echo "❌ 仓库里没有 third_party/aac"

          echo ""
          echo "========================================"
          echo "==== 仓库里 aac 是否有 fdk-aac ===="
          echo "========================================"
          ls -la "$AAC_REPO/fdk-aac/" 2>/dev/null || echo "❌ 没有 fdk-aac 子目录"

          echo ""
          echo "========================================"
          echo "==== 仓库里 aac/BUILD.gn ===="
          echo "========================================"
          cat "$AAC_REPO/BUILD.gn" 2>/dev/null || echo "❌ 没有 BUILD.gn"

          echo ""
          echo "========================================"
          echo "==== gclient sync 后 third_party/aac ===="
          echo "========================================"
          ls -la "$AAC_SYNC/" 2>/dev/null || echo "❌ sync 后没有 third_party/aac"

          echo ""
          echo "========================================"
          echo "==== fdk-aac 所有含 .cpp 的子目录 ===="
          echo "========================================"
          find "$AAC_SYNC/fdk-aac" -name "*.cpp" 2>/dev/null \
            | sed 's|/[^/]*\.cpp$||' | sort -u \
            | while read d; do
                count=$(find "$d" -maxdepth 1 -name "*.cpp" | wc -l | tr -d ' ')
                echo "  $d  ($count .cpp)"
              done || echo "❌ 没有找到 fdk-aac"

          echo ""
          echo "========================================"
          echo "==== modules/audio_coding AAC 相关 BUILD.gn ===="
          echo "========================================"
          grep -r "aac\|AAC" /Users/runner/src/modules/audio_coding/ \
            --include="BUILD.gn" -l 2>/dev/null || echo "没有找到"
          cat /Users/runner/src/modules/audio_coding/BUILD.gn 2>/dev/null \
            | grep -A5 -B5 "aac" || echo "没有找到 aac 相关内容"

      - name: 诊断 FFmpeg
        run: |
          FFMPEG="/Users/runner/src/third_party/ffmpeg"

          echo "========================================"
          echo "==== ffmpeg 根目录文件列表 ===="
          echo "========================================"
          ls -la "$FFMPEG/"

          echo ""
          echo "========================================"
          echo "==== ffmpeg BUILD.gn 完整内容 ===="
          echo "========================================"
          cat "$FFMPEG/BUILD.gn" || echo "❌ 没有 BUILD.gn"

          echo ""
          echo "========================================"
          echo "==== ffmpeg 所有 .gn/.gni 文件 ===="
          echo "========================================"
          find "$FFMPEG" -name "*.gn" -o -name "*.gni" | sort

          echo ""
          echo "========================================"
          echo "==== ffmpeg 子目录结构（3层）===="
          echo "========================================"
          find "$FFMPEG" -maxdepth 3 -type d | sort

          echo ""
          echo "========================================"
          echo "==== ffmpeg 所有预编译库 .a ===="
          echo "========================================"
          find "$FFMPEG" -name "*.a" | sort || echo "没有 .a 文件"

          echo ""
          echo "========================================"
          echo "==== ffmpeg chromium/config 目录 ===="
          echo "========================================"
          ls -la "$FFMPEG/chromium/config/" 2>/dev/null || echo "没有 chromium/config 目录"
          find "$FFMPEG/chromium" -maxdepth 4 -type d 2>/dev/null | sort || echo "没有 chromium 目录"

      - name: 诊断 recorder 和 backing_track
        run: |
          echo "========================================"
          echo "==== modules/recording BUILD.gn ===="
          echo "========================================"
          cat "/Users/runner/src/modules/recording/BUILD.gn" || echo "❌ 没有找到"

          echo ""
          echo "========================================"
          echo "==== modules/backing_track BUILD.gn ===="
          echo "========================================"
          cat "/Users/runner/src/modules/backing_track/BUILD.gn" || echo "❌ 没有找到"

          echo ""
          echo "========================================"
          echo "==== 搜索所有引用 ffmpeg 的 BUILD.gn ===="
          echo "========================================"
          grep -r "ffmpeg" /Users/runner/src/modules/ --include="BUILD.gn" -l \
            2>/dev/null || echo "没有找到"

          echo ""
          echo "========================================"
          echo "==== 搜索 lrt/librt 在哪里被引入 ===="
          echo "========================================"
          grep -r "lrt\|librt" /Users/runner/src/third_party/ffmpeg/ \
            --include="*.gn" --include="*.gni" 2>/dev/null || echo "ffmpeg 里没有找到"
          grep -r "lrt\|librt" /Users/runner/src/modules/ \
            --include="*.gn" 2>/dev/null || echo "modules 里没有找到"

      - name: 诊断仓库 third_party 全貌
        run: |
          echo "========================================"
          echo "==== 仓库里 third_party 所有目录 ===="
          echo "========================================"
          ls -la "$GITHUB_WORKSPACE/third_party/" || echo "❌ 没有 third_party 目录"

          echo ""
          echo "========================================"
          echo "==== 仓库里所有引用 ffmpeg 的 .gn 文件 ===="
          echo "========================================"
          find "$GITHUB_WORKSPACE" -name "*.gn" \
            | xargs grep -l "ffmpeg" 2>/dev/null || echo "没有找到"
