name: Diagnose FFmpeg Link Path

# 目的：在所有已验证修复（aac/ios-config/lrt/deps）之后，确认
#   ffmpeg 的 .o/.a 到底有没有进入 WebRTC framework 的链接列表(rsp)。
# 据此判断是「ffmpeg 没被编译」还是「编了但没被 all_load 拉进 framework」。

on:
  workflow_dispatch:

jobs:
  diagnose-ffmpeg-link:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: add-aac-softcodec-mp4recording
          fetch-depth: 1

      - name: 安装 Python 3.11 和 setuptools
        run: |
          brew install python@3.11
          /opt/homebrew/opt/python@3.11/bin/python3.11 -m pip install setuptools --break-system-packages

      - name: 安装 depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: 写入 gclient 配置
        run: |
          cd $HOME
          cat > .gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/liu9812111/amazon-kvs-webrtc-ndk-c.git@add-aac-softcodec-mp4recording",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {},
            },
          ]
          target_os = ["ios"]
          GCLIENT_EOF

      - name: 恢复 gclient 依赖缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/src/third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}
          restore-keys: gclient-ios-

      - name: 同步依赖并修复后执行 hooks
        run: |
          cd $HOME
          gclient sync --no-history --shallow --nohooks
          python3 -c "
          path = '/Users/runner/src/build/mac_toolchain.py'
          with open(path) as f:
              content = f.read()
          if 'except ImportError' not in content:
              content = content.replace(
                  'import pkg_resources',
                  'try:\n    import pkg_resources\nexcept ImportError:\n    pkg_resources = None'
              )
              with open(path, 'w') as f:
                  f.write(content)
          "
          gclient runhooks

      - name: 保存 gclient 依赖缓存
        if: always() && steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /Users/runner/src/third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}

      - name: 部署 aac（三名字：aac/aac_3p/rtc_aac）
        run: |
          AAC_SRC="$GITHUB_WORKSPACE/third_party/aac"
          AAC_DST="/Users/runner/src/third_party/aac"
          rm -rf "$AAC_DST"; mkdir -p "$AAC_DST"
          if [ ! -d "$AAC_SRC/fdk-aac" ]; then
            git clone --depth=1 https://github.com/mstorsjo/fdk-aac.git "$AAC_DST/fdk-aac"
            rm -rf "$AAC_DST/fdk-aac/.git"
          else
            cp -R "$AAC_SRC/." "$AAC_DST/"
          fi
          python3 - "$AAC_DST" << 'PYEOF'
          import os, sys
          aac_dst = sys.argv[1]; fdk_root = os.path.join(aac_dst, "fdk-aac")
          excluded = {"arm","win32","x86","fuzzer","mips","aarch64","tests","benchmark"}
          sources=[]
          for dp,dn,fn in os.walk(fdk_root):
              if set(os.path.relpath(dp,aac_dst).split(os.sep)) & excluded: continue
              for f in sorted(fn):
                  if f.endswith(".cpp"):
                      sources.append(os.path.relpath(os.path.join(dp,f),aac_dst))
          sources.sort()
          inc=["fdk-aac","."]
          for e in sorted(os.listdir(fdk_root)):
              if os.path.isdir(os.path.join(fdk_root,e,"include")): inc.append(f"fdk-aac/{e}/include")
          ss="\n".join(f'    "{s}",' for s in sources)
          ii="\n".join(f'    "{d}",' for d in inc)
          open(os.path.join(aac_dst,"BUILD.gn"),"w").write(f'''config("aac_includes") {{
            include_dirs = [
          {ii}
            ]
          }}
          static_library("aac") {{
            sources = [
          {ss}
            ]
            defines = [ "SUPPRESS_BUILD_DATE_INFO" ]
            public_configs = [ ":aac_includes" ]
            configs -= [ "//build/config/compiler:chromium_code" ]
            configs += [ "//build/config/compiler:no_chromium_code" ]
            cflags = [ "-w" ]
            cflags_cc = [ "-w" ]
          }}
          group("aac_3p") {{ public_deps = [ ":aac" ] }}
          group("rtc_aac") {{ public_deps = [ ":aac" ] }}
          ''')
          PYEOF

      - name: 生成 ffmpeg iOS config
        run: |
          FF=/Users/runner/src/third_party/ffmpeg
          for BRAND in Chromium Chrome; do
            SRC="$FF/chromium/config/$BRAND/mac/arm64"
            DST="$FF/chromium/config/$BRAND/ios/arm64"
            if [ -d "$SRC" ]; then
              rm -rf "$DST"
              mkdir -p "$DST"
              # 用 tar 管道复制，避开 macOS cp -R 的 xattr 报错
              ( cd "$SRC" && tar cf - . ) | ( cd "$DST" && tar xf - )
              echo "已生成 $DST"
            fi
          done

      - name: Patch BUILD.gn（lrt + deps + recording）
        run: |
          SRC=/Users/runner/src; FF=$SRC/third_party/ffmpeg
          sed -i '' 's/is_posix && !is_mac)/is_posix \&\& !is_mac \&\& !is_ios)/g' "$FF/BUILD.gn"
          python3 - << 'PYEOF'
          p="/Users/runner/src/modules/recording/BUILD.gn"; s=open(p).read()
          s=s.replace("deps = [\n  ]",'deps = [\n    "//third_party/ffmpeg",\n  ]')
          open(p,"w").write(s)
          p="/Users/runner/src/modules/backing_track/BUILD.gn"; s=open(p).read()
          s=s.replace('"../audio_mixer:audio_mixer_impl",','"../audio_mixer:audio_mixer_impl",\n    "//third_party/ffmpeg",')
          open(p,"w").write(s)
          p="/Users/runner/src/sdk/BUILD.gn"; s=open(p).read()
          if '//modules/recording:recording' not in s:
              s=s.replace('"//modules/backing_track:backing_track",','"//modules/backing_track:backing_track",\n          "//modules/recording:recording",')
              open(p,"w").write(s)
          PYEOF

      - name: 升级 clang
        run: |
          cd /Users/runner/src
          curl -fsSL "https://chromium.googlesource.com/chromium/src/+/refs/branch-heads/5993/tools/clang/scripts/update.py?format=TEXT" \
            | python3 -c "import base64,sys;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > /tmp/clang_update.py
          rm -rf third_party/llvm-build
          python3.11 /tmp/clang_update.py --output-dir third_party/llvm-build/Release+Asserts
          cp /tmp/clang_update.py tools/clang/scripts/update.py
          sed -i '' -E 's/clang_version = "16[0-9.]*"/clang_version = "17"/' build/toolchain/toolchain.gni

      # ============================================================
      # 只做 gn gen，不编译完整 framework，然后用 gn 查依赖
      # ============================================================
      - name: gn gen
        run: |
          export PATH="/opt/homebrew/opt/python@3.11/bin:$HOME/depot_tools:$PATH"
          cd /Users/runner/src
          OUTDIR=out/diag
          python3.11 third_party/depot_tools/gn.py gen "$OUTDIR" --args='target_os="ios" ios_enable_code_signing=false is_component_build=false rtc_include_tests=false is_debug=false target_environment="device" target_cpu="arm64" ios_deployment_target="12.0" rtc_libvpx_build_vp9=false use_lld=true treat_warnings_as_errors=false is_component_ffmpeg=false'

      - name: "[核心1] ffmpeg target 是否存在 + 类型"
        run: |
          export PATH="/opt/homebrew/opt/python@3.11/bin:$HOME/depot_tools:$PATH"
          cd /Users/runner/src; OUTDIR=out/diag
          echo "==== gn desc //third_party/ffmpeg ===="
          python3.11 third_party/depot_tools/gn.py desc "$OUTDIR" //third_party/ffmpeg 2>&1 | head -40 || echo "❌ ffmpeg target 不存在"
          echo ""
          echo "==== gn desc //third_party/ffmpeg:ffmpeg_internal ===="
          python3.11 third_party/depot_tools/gn.py desc "$OUTDIR" //third_party/ffmpeg:ffmpeg_internal 2>&1 | head -20 || echo "❌ 没有 ffmpeg_internal"

      - name: "[核心2] framework_objc 到 ffmpeg 有没有依赖路径"
        run: |
          export PATH="/opt/homebrew/opt/python@3.11/bin:$HOME/depot_tools:$PATH"
          cd /Users/runner/src; OUTDIR=out/diag
          echo "==== gn path: framework_objc -> ffmpeg ===="
          python3.11 third_party/depot_tools/gn.py path "$OUTDIR" //sdk:framework_objc //third_party/ffmpeg 2>&1 | head -40 || echo "❌ 无依赖路径 —— 这就是没链进来的原因"
          echo ""
          echo "==== gn path: framework_objc -> recording ===="
          python3.11 third_party/depot_tools/gn.py path "$OUTDIR" //sdk:framework_objc //modules/recording:recording 2>&1 | head -30 || echo "❌ recording 没被 framework 依赖"
          echo ""
          echo "==== gn path: framework_objc -> backing_track ===="
          python3.11 third_party/depot_tools/gn.py path "$OUTDIR" //sdk:framework_objc //modules/backing_track:backing_track 2>&1 | head -30 || echo "❌ backing_track 没被 framework 依赖"

      - name: "[核心3] 实际编译 ffmpeg target，确认能产出 .a"
        run: |
          export PATH="/opt/homebrew/opt/python@3.11/bin:$HOME/depot_tools:$PATH"
          cd /Users/runner/src; OUTDIR=out/diag
          echo "==== 只 build ffmpeg target ===="
          python3.11 third_party/depot_tools/ninja.py -C "$OUTDIR" third_party/ffmpeg:ffmpeg 2>&1 | tail -30 || echo "ffmpeg 编译失败（见上）"
          echo ""
          echo "==== 找产物 .a / .o ===="
          find "$OUTDIR" -name "*ffmpeg*" \( -name "*.a" -o -name "*.o" \) 2>/dev/null | head -20 || echo "没有 ffmpeg 产物"
          find "$OUTDIR/obj/third_party/ffmpeg" -type f 2>/dev/null | head -30 || echo "obj/third_party/ffmpeg 目录不存在 —— ffmpeg 根本没编译"

      - name: "[核心4] WebRTC.rsp 里有没有 ffmpeg 的 .o/.a"
        run: |
          cd /Users/runner/src; OUTDIR=out/diag
          RSP=$(find "$OUTDIR" -name "WebRTC.rsp" 2>/dev/null | head -1)
          echo "rsp 文件: $RSP"
          if [ -n "$RSP" ]; then
            echo "==== rsp 里 ffmpeg 相关条目 ===="
            grep -o '[^ ]*ffmpeg[^ ]*' "$RSP" | sort -u || echo "❌ rsp 里没有任何 ffmpeg —— 确认没被链入"
            echo ""
            echo "==== rsp 里 recording / backing_track 条目 ===="
            grep -o '[^ ]*\(recording\|backing_track\)[^ ]*' "$RSP" | sort -u || echo "❌ 没有"
          else
            echo "（此时 rsp 可能还没生成，需先触发一次 framework 链接）"
          fi
