name: Diagnose Link Dependencies

# 目的：把"修复 FFmpeg 链接失败"所需的全部关键信息一次性打印出来。
# 重点是三个 BUILD.gn（recording / backing_track / sdk:WebRTC framework）
# 以及 ffmpeg 的 iOS config 现状。拿到这些后才能写出一次成型的完整编译 yml。

on:
  workflow_dispatch:

jobs:
  diagnose-link:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: add-aac-softcodec-mp4recording
          fetch-depth: 1

      - name: 安装 depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: 写入 gclient 配置
        run: |
          cd $HOME
          cat > .gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/liu9812111/amazon-kvs-webrtc-ndk-c.git@add-aac-softcodec-mp4recording",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {},
            },
          ]
          target_os = ["ios"]
          GCLIENT_EOF

      - name: 恢复 gclient 依赖缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/src/third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}
          restore-keys: gclient-ios-

      - name: 同步依赖（nohooks）
        run: |
          cd $HOME
          gclient sync --no-history --shallow --nohooks

      # ============================================================
      # 第 1 块：引用 ffmpeg 符号的两个模块的 BUILD.gn —— 修复 B 的核心
      # ============================================================
      - name: "[关键1] recording / backing_track 的 BUILD.gn"
        run: |
          SRC=/Users/runner/src
          for m in recording backing_track; do
            echo "############################################################"
            echo "#### modules/$m/BUILD.gn 完整内容"
            echo "############################################################"
            cat "$SRC/modules/$m/BUILD.gn" 2>/dev/null || echo "❌ 不存在 modules/$m/BUILD.gn"
            echo ""
            echo "---- 该目录下所有文件 ----"
            ls -la "$SRC/modules/$m/" 2>/dev/null || echo "❌ 目录不存在"
            echo ""
            echo "---- 该 BUILD.gn 里是否已引用 ffmpeg ----"
            grep -n "ffmpeg" "$SRC/modules/$m/BUILD.gn" 2>/dev/null || echo "（没有任何 ffmpeg 引用 —— 这就是 undefined symbol 的原因）"
            echo ""
          done

      # ============================================================
      # 第 2 块：sdk/BUILD.gn —— framework target 怎么拉进 recording/backing_track
      # ============================================================
      - name: "[关键2] sdk/BUILD.gn 中 WebRTC framework 的 deps"
        run: |
          SRC=/Users/runner/src
          echo "############################################################"
          echo "#### sdk/BUILD.gn 中所有 framework / WebRTC target 定义"
          echo "############################################################"
          # 只打印和 framework_objc / WebRTC framework 相关的 target 块
          grep -n "rtc_framework\|framework_objc\|ios_framework\|apple_framework\|\"WebRTC\"" "$SRC/sdk/BUILD.gn" 2>/dev/null || echo "❌ sdk/BUILD.gn 没找到相关 target"
          echo ""
          echo "---- 提取 framework_objc target 整块（含 deps）----"
          awk '/framework_objc|apple_framework_bundle.*WebRTC|rtc_framework/{flag=1} flag{print} /^}/{if(flag)c++; if(c>=1 && flag && /^}/){flag=0;c=0;print "----（块结束）----"}}' "$SRC/sdk/BUILD.gn" 2>/dev/null | head -200
          echo ""
          echo "---- sdk/BUILD.gn 里 recording / backing_track / ffmpeg 的引用位置 ----"
          grep -n "recording\|backing_track\|ffmpeg" "$SRC/sdk/BUILD.gn" 2>/dev/null || echo "（没有引用）"

      - name: "[关键2b] 全树搜索谁依赖 recording / backing_track"
        run: |
          SRC=/Users/runner/src
          echo "==== 谁把 modules/recording 写进了 deps ===="
          grep -rn "modules/recording\|recording:recording\|\"../recording\"\|recording\b" "$SRC/sdk/" "$SRC/api/" "$SRC/pc/" --include="BUILD.gn" 2>/dev/null | grep -i record || echo "没找到引用 recording 的地方"
          echo ""
          echo "==== 谁把 modules/backing_track 写进了 deps ===="
          grep -rn "backing_track" "$SRC" --include="BUILD.gn" 2>/dev/null || echo "没找到引用 backing_track 的地方"

      # ============================================================
      # 第 3 块：ffmpeg target 本身 —— 它是 source_set 还是要预编译？ios config 缺啥
      # ============================================================
      - name: "[关键3] ffmpeg target 类型与 iOS config 现状"
        run: |
          FF=/Users/runner/src/third_party/ffmpeg
          echo "==== ffmpeg_options.gni（决定 branding / 是否 component）===="
          cat "$FF/ffmpeg_options.gni" 2>/dev/null || echo "❌ 没有"
          echo ""
          echo "==== ffmpeg BUILD.gn 里 platform_config_root 与 os_config 的定义 ===="
          grep -n "platform_config_root\|os_config\|ffmpeg_arch\|ffmpeg_branding" "$FF/BUILD.gn" 2>/dev/null
          echo ""
          echo "==== 现有 config 平台档（确认有没有 ios / mac-arm64 可复用）===="
          find "$FF/chromium/config" -maxdepth 4 -type d 2>/dev/null | sort
          echo ""
          echo "==== mac/arm64 config 里有哪些文件（要复用成 ios 的话看这里）===="
          ls -la "$FF/chromium/config/Chromium/mac/arm64/" 2>/dev/null || echo "❌ 没有 Chromium/mac/arm64"
          echo ""
          echo "==== 看 mac arm64 的 config.h 里 librt / clock_gettime 相关项（解释 -lrt 来源）===="
          grep -n "HAVE_CLOCK_GETTIME\|HAVE_LIBRT\|librt" "$FF/chromium/config/Chromium/mac/arm64/config.h" 2>/dev/null || echo "没有这些项"

      - name: "[关键3b] ffmpeg BUILD.gn 里 -lrt 来源那段 posix 分支"
        run: |
          FF=/Users/runner/src/third_party/ffmpeg
          echo "==== libs += rt 的上下文（确认 iOS 是否会命中 is_posix && !is_mac）===="
          grep -n -B8 -A4 '"rt"' "$FF/BUILD.gn" 2>/dev/null || echo "BUILD.gn 里没有显式 rt（可能来自别处）"
          echo ""
          echo "==== 是否有 is_ios 判断 ===="
          grep -n "is_ios\|is_apple\|is_mac" "$FF/BUILD.gn" 2>/dev/null || echo "ffmpeg BUILD.gn 完全没区分 ios"

      # ============================================================
      # 第 4 块：AAC（你 BUILD.gn 是动态生成的，确认 aac_3p target 名对得上）
      # ============================================================
      - name: "[关键4] audio_coding 期望的 aac target 名"
        run: |
          SRC=/Users/runner/src
          echo "==== audio_coding/BUILD.gn 里引用 third_party/aac 的 target 名 ===="
          grep -n "third_party/aac\|rtc_aac_dir\|aac_3p\|:aac" "$SRC/modules/audio_coding/BUILD.gn" 2>/dev/null || echo "没找到"
          echo ""
          echo "==== 你的脚本生成的 BUILD.gn 提供的是 group(\"rtc_aac\") 和 static_library(\"aac\") ===="
          echo "==== 但 audio_coding 期望的是 ../third_party/aac:aac_3p —— target 名可能对不上！===="
