name: Diagnose Link Targets (minimal)

# 只做 cat，不编译。一次性看清：
#  1. ffmpeg/BUILD.gn 对外 ffmpeg target 怎么定义（决定 source_set 改法是否可行）
#  2. ffmpeg/BUILD.gn 里 link_target_type 的真实写法（上次 sed 是否匹配）
#  3. sdk/BUILD.gn 里 avconf_objc / framework_objc 的 deps（ffmpeg 该挂哪）
#  4. recording / backing_track patch 后的 deps

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: add-aac-softcodec-mp4recording
          fetch-depth: 1

      - name: 安装 depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: 写入 gclient 配置
        run: |
          cd $HOME
          cat > .gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/liu9812111/amazon-kvs-webrtc-ndk-c.git@add-aac-softcodec-mp4recording",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {},
            },
          ]
          target_os = ["ios"]
          GCLIENT_EOF

      - name: 恢复 gclient 依赖缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/src/third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}
          restore-keys: gclient-ios-

      - name: 同步依赖（nohooks，够 cat 即可）
        run: |
          cd $HOME
          gclient sync --no-history --shallow --nohooks

      # ============================================================
      # 1. ffmpeg/BUILD.gn —— 对外 target 定义 + link_target_type
      # ============================================================
      - name: "[1] ffmpeg BUILD.gn 关键段"
        run: |
          FF=/Users/runner/src/third_party/ffmpeg/BUILD.gn
          echo "==== link_target_type 定义那几行（含上下文）===="
          grep -n -B2 -A2 'link_target_type' "$FF"
          echo ""
          echo "==== ffmpeg_internal target 声明行 ===="
          grep -n 'target(link_target_type\|static_library("ffmpeg\|source_set("ffmpeg\|shared_library("ffmpeg' "$FF"
          echo ""
          echo "==== BUILD.gn 最后 60 行（对外 ffmpeg target 定义）===="
          tail -60 "$FF"

      # ============================================================
      # 2. sdk/BUILD.gn —— avconf_objc 与 framework_objc 的 deps
      # ============================================================
      - name: "[2] sdk avconf_objc / framework_objc deps"
        run: |
          SDK=/Users/runner/src/sdk/BUILD.gn
          echo "==== avconf_objc target 整块（recording/backing_track 就挂这）===="
          awk '/[a-z_]*\("avconf_objc"\)/{f=1} f{print NR": "$0} f&&/^[[:space:]]*}$/{c++; if(c>=1){exit}}' "$SDK" | head -80
          echo ""
          echo "==== avconf_objc 出现的位置 ===="
          grep -n 'avconf_objc' "$SDK"
          echo ""
          echo "==== framework_objc 里 deps 段（看 ffmpeg/recording/backing_track 怎么进来）===="
          grep -n 'ffmpeg\|recording\|backing_track\|avconf_objc' "$SDK"

      # ============================================================
      # 3. recording / backing_track 当前 deps（patch 前的原始态）
      # ============================================================
      - name: "[3] recording / backing_track 原始 BUILD.gn"
        run: |
          SRC=/Users/runner/src
          echo "==== recording/BUILD.gn ===="
          cat "$SRC/modules/recording/BUILD.gn"
          echo ""
          echo "==== backing_track/BUILD.gn（deps 段）===="
          grep -n -A12 'deps = \[' "$SRC/modules/backing_track/BUILD.gn"

      # ============================================================
      # 4. avconf_objc 到底是不是 rtc_source_set（决定 .o 能否进 framework）
      # ============================================================
      - name: "[4] avconf_objc 的 target 类型"
        run: |
          SDK=/Users/runner/src/sdk/BUILD.gn
          echo "==== avconf_objc 用的是哪种 target 模板 ===="
          grep -n -B1 '"avconf_objc"' "$SDK"
