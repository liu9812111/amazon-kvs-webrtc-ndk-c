name: Diagnose FFmpeg Sources Empty

# 双重验证：
#  A. ffmpeg_generated.gni 里 ffmpeg_c_sources 在 iOS 下是否解析为空
#     （复用 mac config != 复用 mac 的源文件列表）
#  B. 强制删 out 后 gn gen，确认不是缓存导致的旧图

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: add-aac-softcodec-mp4recording
          fetch-depth: 1

      - name: 安装 Python 3.11
        run: |
          brew install python@3.11
          /opt/homebrew/opt/python@3.11/bin/python3.11 -m pip install setuptools --break-system-packages

      - name: 安装 depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: 写入 gclient 配置
        run: |
          cd $HOME
          cat > .gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/liu9812111/amazon-kvs-webrtc-ndk-c.git@add-aac-softcodec-mp4recording",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {},
            },
          ]
          target_os = ["ios"]
          GCLIENT_EOF

      - name: 恢复 gclient 依赖缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/src/third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}
          restore-keys: gclient-ios-

      - name: 同步依赖
        run: |
          cd $HOME
          gclient sync --no-history --shallow --nohooks
          python3 -c "
          path = '/Users/runner/src/build/mac_toolchain.py'
          c = open(path).read()
          if 'except ImportError' not in c:
              c = c.replace('import pkg_resources','try:\n    import pkg_resources\nexcept ImportError:\n    pkg_resources = None')
              open(path,'w').write(c)
          "
          gclient runhooks

      # ============================================================
      # A. ffmpeg_generated.gni 平台分支结构 —— 有没有 ios 分支
      # ============================================================
      - name: "[A1] ffmpeg_generated.gni 的平台分支"
        run: |
          GNI=/Users/runner/src/third_party/ffmpeg/ffmpeg_generated.gni
          echo "==== ffmpeg_c_sources 是怎么按平台赋值的（看所有 if 条件）===="
          grep -n 'if (\|ffmpeg_c_sources\|use_linux_config\|is_mac\|is_ios\|is_android\|current_cpu\|os_config' "$GNI" | head -60
          echo ""
          echo "==== gni 文件头部 50 行（看整体结构）===="
          head -50 "$GNI"

      - name: "[A2] gni 里 mac / ios 关键词出现情况"
        run: |
          GNI=/Users/runner/src/third_party/ffmpeg/ffmpeg_generated.gni
          echo "==== 出现 is_mac 的行 ===="
          grep -n 'is_mac' "$GNI" || echo "没有 is_mac"
          echo ""
          echo "==== 出现 is_ios 的行 ===="
          grep -n 'is_ios' "$GNI" || echo "❌ gni 完全没有 is_ios 分支 —— iOS 下 ffmpeg_c_sources 很可能为空"
          echo ""
          echo "==== 出现 use_linux_config / 类似平台开关 ===="
          grep -n 'use_linux_config\|use_.*_config\|_config =' "$GNI" | head -20
          echo ""
          echo "==== 统计 ffmpeg_c_sources 总共列了多少 .c（不分平台）===="
          grep -c '\.c"' "$GNI" || echo 0

      # ============================================================
      # B. 强制删 out，gn gen 后实测 ffmpeg_internal 的 sources 数
      # ============================================================
      - name: 部署 aac + ios config + patch（复用正式修复逻辑精简版）
        run: |
          # aac
          AAC_DST=/Users/runner/src/third_party/aac
          rm -rf "$AAC_DST"; mkdir -p "$AAC_DST"
          git clone --depth=1 https://github.com/mstorsjo/fdk-aac.git "$AAC_DST/fdk-aac"
          rm -rf "$AAC_DST/fdk-aac/.git"
          python3 - "$AAC_DST" << 'PYEOF'
          import os,sys
          a=sys.argv[1]; r=os.path.join(a,"fdk-aac")
          ex={"arm","win32","x86","fuzzer","mips","aarch64","tests","benchmark"}
          src=[]
          for dp,dn,fn in os.walk(r):
              if set(os.path.relpath(dp,a).split(os.sep))&ex: continue
              for f in sorted(fn):
                  if f.endswith(".cpp"): src.append(os.path.relpath(os.path.join(dp,f),a))
          src.sort()
          inc=["fdk-aac","."]+[f"fdk-aac/{e}/include" for e in sorted(os.listdir(r)) if os.path.isdir(os.path.join(r,e,"include"))]
          ss="\n".join(f'    "{s}",' for s in src); ii="\n".join(f'    "{d}",' for d in inc)
          open(os.path.join(a,"BUILD.gn"),"w").write(f'config("aac_includes"){{include_dirs=[\n{ii}\n]}}\nstatic_library("aac"){{sources=[\n{ss}\n]\ndefines=["SUPPRESS_BUILD_DATE_INFO"]\npublic_configs=[":aac_includes"]\nconfigs-=["//build/config/compiler:chromium_code"]\nconfigs+=["//build/config/compiler:no_chromium_code"]\ncflags=["-w"]\ncflags_cc=["-w"]}}\ngroup("aac_3p"){{public_deps=[":aac"]}}\ngroup("rtc_aac"){{public_deps=[":aac"]}}\n')
          PYEOF
          # ios config
          FF=/Users/runner/src/third_party/ffmpeg
          for B in Chromium Chrome; do
            S="$FF/chromium/config/$B/mac/arm64"; D="$FF/chromium/config/$B/ios/arm64"
            [ -d "$S" ] && { rm -rf "$D"; mkdir -p "$D"; ( cd "$S" && tar cf - . ) | ( cd "$D" && tar xf - ); }
          done
          # patch
          sed -i '' 's/is_posix && !is_mac)/is_posix \&\& !is_mac \&\& !is_ios)/g' "$FF/BUILD.gn"
          sed -i '' 's/link_target_type = "static_library"/link_target_type = "source_set"/' "$FF/BUILD.gn"
          python3 - << 'PYEOF'
          p="/Users/runner/src/modules/recording/BUILD.gn"; s=open(p).read()
          open(p,"w").write(s.replace("deps = [\n  ]",'deps = [\n    "//third_party/ffmpeg",\n  ]'))
          p="/Users/runner/src/modules/backing_track/BUILD.gn"; s=open(p).read()
          open(p,"w").write(s.replace('"../audio_mixer:audio_mixer_impl",','"../audio_mixer:audio_mixer_impl",\n    "//third_party/ffmpeg",'))
          PYEOF

      - name: 升级 clang
        run: |
          cd /Users/runner/src
          curl -fsSL "https://chromium.googlesource.com/chromium/src/+/refs/branch-heads/5993/tools/clang/scripts/update.py?format=TEXT" \
            | python3 -c "import base64,sys;sys.stdout.buffer.write(base64.b64decode(sys.stdin.read()))" > /tmp/cu.py
          rm -rf third_party/llvm-build
          python3.11 /tmp/cu.py --output-dir third_party/llvm-build/Release+Asserts
          cp /tmp/cu.py tools/clang/scripts/update.py
          sed -i '' -E 's/clang_version = "16[0-9.]*"/clang_version = "17"/' build/toolchain/toolchain.gni

      - name: "[B] 强制删 out 后 gn gen + 查 ffmpeg_internal sources 数"
        run: |
          export PATH="/opt/homebrew/opt/python@3.11/bin:$HOME/depot_tools:$PATH"
          cd /Users/runner/src
          rm -rf out/diag
          python3.11 third_party/depot_tools/gn.py gen out/diag --args='target_os="ios" ios_enable_code_signing=false is_component_build=false rtc_include_tests=false is_debug=false target_environment="device" target_cpu="arm64" ios_deployment_target="12.0" rtc_libvpx_build_vp9=false use_lld=true treat_warnings_as_errors=false is_component_ffmpeg=false'
          echo ""
          echo "==== ffmpeg_internal 的 sources 数量（关键！为 0 就证明 gni 没给 ios 列源文件）===="
          python3.11 third_party/depot_tools/gn.py desc out/diag //third_party/ffmpeg:ffmpeg_internal sources 2>&1 | head -40
          echo ""
          echo "---- sources 行数统计 ----"
          python3.11 third_party/depot_tools/gn.py desc out/diag //third_party/ffmpeg:ffmpeg_internal sources 2>&1 | grep -c '\.c' || echo "0 个 .c 文件"
          echo ""
          echo "==== 同时看 ffmpeg target 的 deps（确认 source_set 生效）===="
          python3.11 third_party/depot_tools/gn.py desc out/diag //third_party/ffmpeg:ffmpeg_internal 2>&1 | grep -A3 'type:'
