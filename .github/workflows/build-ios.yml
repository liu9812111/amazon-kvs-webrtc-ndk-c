name: Build iOS XCFramework

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装 Python setuptools
        run: |
          python3 -m pip install setuptools --break-system-packages

      - name: 安装 depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: 写入 gclient 配置
        run: |
          cd $GITHUB_WORKSPACE/..
          cat > .gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/liu9812111/amazon-kvs-webrtc-ndk-c.git@add-aac-softcodec-mp4recording",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {},
            },
          ]
          target_os = ["ios"]
          GCLIENT_EOF

      - name: 缓存 gclient 依赖
        uses: actions/cache@v4
        id: gclient-cache
        with:
          path: |
            ${{ github.workspace }}/../.cipd
            ${{ github.workspace }}/../third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}
          restore-keys: gclient-ios-

      - name: 同步依赖并修复后执行 hooks
        run: |
          cd $GITHUB_WORKSPACE/..
          gclient sync --no-history --shallow --nohooks
          TOOLCHAIN=$(find /Users/runner/work -name "mac_toolchain.py" 2>/dev/null | head -1)
          echo "找到文件: $TOOLCHAIN"
          python3 -c "
          import sys
          path = sys.argv[1]
          with open(path) as f:
              content = f.read()
          content = content.replace(
              'import pkg_resources',
              'try:\n    import pkg_resources\nexcept ImportError:\n    pkg_resources = None'
          )
          with open(path, 'w') as f:
              f.write(content)
          print('修复完成:', path)
          " "$TOOLCHAIN"
          gclient runhooks

      - name: 保存缓存（即使失败也保存）
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ github.workspace }}/../.cipd
            ${{ github.workspace }}/../third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}

      - name: 编译 iOS XCFramework
        run: |
          export PATH="$HOME/depot_tools:$PATH"
          export PYTHONPATH="$HOME/depot_tools"
          cd $GITHUB_WORKSPACE
          # 验证 find_depot_tools 能找到
          python3 -c "import sys; sys.path.insert(0,'$HOME/depot_tools'); import find_depot_tools; print('find_depot_tools OK')"
          # 用 PYTHONPATH 运行编译脚本
          PYTHONPATH="$HOME/depot_tools" python3 tools_webrtc/ios/build_ios_libs.py \
            --output out/ios-release \
            --arch arm64 \
            --build_config release

      - name: 打包成 zip
        run: |
          zip -r WebRTC.xcframework.zip out/ios-release/WebRTC.xcframework

      - name: 上传为 Artifact（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: WebRTC-iOS-XCFramework
          path: WebRTC.xcframework.zip
          retention-days: 30
