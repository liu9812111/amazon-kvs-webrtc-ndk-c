name: Diagnose Missing FFmpeg Sources

# av_audio_fifo_* 和 swr_* 缺失。列出 libswresample / audio_fifo 的源文件，
# 以及它们是否已在某处被 ffmpeg 列出，供精准补源。

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: add-aac-softcodec-mp4recording
          fetch-depth: 1

      - name: 安装 depot_tools
        run: |
          git clone --depth=1 https://chromium.googlesource.com/chromium/tools/depot_tools.git $HOME/depot_tools
          echo "$HOME/depot_tools" >> $GITHUB_PATH

      - name: 写入 gclient 配置
        run: |
          cd $HOME
          cat > .gclient << 'GCLIENT_EOF'
          solutions = [
            {
              "name": "src",
              "url": "https://github.com/liu9812111/amazon-kvs-webrtc-ndk-c.git@add-aac-softcodec-mp4recording",
              "deps_file": "DEPS",
              "managed": False,
              "custom_vars": {},
            },
          ]
          target_os = ["ios"]
          GCLIENT_EOF

      - name: 恢复 gclient 依赖缓存
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: /Users/runner/src/third_party
          key: gclient-ios-${{ hashFiles('DEPS') }}
          restore-keys: gclient-ios-

      - name: 同步依赖
        run: |
          cd $HOME
          gclient sync --no-history --shallow --nohooks

      - name: "[1] libswresample 全部 .c"
        run: |
          SW=/Users/runner/src/third_party/ffmpeg/libswresample
          echo "==== libswresample 根目录 .c（不含 arch 子目录）===="
          find "$SW" -maxdepth 1 -name "*.c" | sort
          echo ""
          echo "==== libswresample/aarch64 下 .c（arm64 可能需要）===="
          find "$SW/aarch64" -name "*.c" 2>/dev/null | sort || echo "无 aarch64 目录"
          echo ""
          echo "==== 全部子目录 ===="
          find "$SW" -type d | sort

      - name: "[2] audio_fifo 所在与依赖"
        run: |
          FF=/Users/runner/src/third_party/ffmpeg
          echo "==== audio_fifo.c 位置 ===="
          find "$FF" -name "audio_fifo.c" | sort
          echo ""
          echo "==== audio_fifo.c 里 include 了哪些本地头（看依赖）===="
          AF=$(find "$FF" -name "audio_fifo.c" | head -1)
          grep -n '#include' "$AF" 2>/dev/null || echo "找不到"

      - name: "[3] gni 里现在有没有 swresample / audio_fifo"
        run: |
          GNI=/Users/runner/src/third_party/ffmpeg/ffmpeg_generated.gni
          echo "==== gni 里 swresample 相关行 ===="
          grep -n 'swresample\|swr' "$GNI" || echo "❌ gni 完全没有 swresample —— 需整组补入"
          echo ""
          echo "==== gni 里 audio_fifo 相关行 ===="
          grep -n 'audio_fifo' "$GNI" || echo "❌ gni 没有 audio_fifo —— 需补入"

      - name: "[4] ffmpeg configure 对 swresample 的默认开关"
        run: |
          FF=/Users/runner/src/third_party/ffmpeg
          echo "==== mac/arm64 config.h 里 swresample / audio_fifo 相关 ===="
          grep -n -i 'swresample\|swr\|audio_fifo\|CONFIG_SWRESAMPLE' \
            "$FF/chromium/config/Chromium/mac/arm64/config.h" 2>/dev/null | head -20 || echo "config.h 里没提"
          echo ""
          echo "==== libswresample 是否有自己的 Makefile（看完整源清单）===="
          cat "$FF/libswresample/Makefile" 2>/dev/null | head -40 || echo "无 Makefile"
